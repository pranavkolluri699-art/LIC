<path class="edge" d="M305 235h85M760 210h85M760 315l85 95M760 330h85"/><text class="s" x="575" y="585" text-anchor="middle">The checked-in code uses local services and files. Production hosting and external integrations are not specified.</text><text class="s" x="575" y="615" text-anchor="middle">Browser speech recognition depends on browser support; generated reply audio is served by Flask.</text></svg>
