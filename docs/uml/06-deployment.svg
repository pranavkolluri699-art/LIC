<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="740" viewBox="0 0 1150 740" role="img" aria-labelledby="title desc">
<title id="title">INSURA deployment diagram</title><desc id="desc">Local deployment nodes for browser, Flask, models, vector store and local data.</desc>
<defs><style>.bg{fill:#f8fafc}.node{fill:#fff;stroke:#2563eb;stroke-width:2.5}.inner{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}.t{font:17px Arial;fill:#172554}.h{font:bold 27px Arial;fill:#0f172a}.s{font:14px Arial;fill:#475569}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#64748b"/></marker></defs>
<rect class="bg" width="1150" height="740"/><text class="h" x="575" y="45" text-anchor="middle">INSURA — Deployment Diagram</text>
<rect class="node" x="45" y="130" width="260" height="220" rx="18"/><text class="t" x="175" y="165" text-anchor="middle">Customer Device</text><rect class="inner" x="75" y="195" width="200" height="95" rx="12"/><text class="s" x="175" y="230" text-anchor="middle">Web Browser</text><text class="s" x="175" y="260" text-anchor="middle">HTML / CSS / JavaScript</text><text class="s" x="175" y="320" text-anchor="middle">HTTP to Flask API</text>
<rect class="node" x="390" y="100" width="370" height="280" rx="18"/><text class="t" x="575" y="135" text-anchor="middle">Application Host</text><rect class="inner" x="430" y="165" width="290" height="90" rx="12"/><text class="s" x="575" y="200" text-anchor="middle">Python Flask application</text><text class="s" x="575" y="230" text-anchor="middle">127.0.0.1:5000 (development)</text><rect class="inner" x="430" y="275" width="290" height="75" rx="12"/><text class="s" x="575" y="307" text-anchor="middle">SQLite + Excel + generated audio</text><text class="s" x="575" y="332" text-anchor="middle">stored under backend/</text>
