<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">INSURA class and module diagram</title><desc id="desc">Core software modules and their data relationships.</desc>
