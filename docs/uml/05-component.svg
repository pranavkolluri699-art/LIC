<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="740" viewBox="0 0 1150 740" role="img" aria-labelledby="title desc">
<title id="title">INSURA component diagram</title><desc id="desc">Frontend, Flask API, model and data components.</desc>
<defs><style>.bg{fill:#f8fafc}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.data{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}.t{font:17px Arial;fill:#172554}.h{font:bold 27px Arial;fill:#0f172a}.s{font:14px Arial;fill:#475569}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#64748b"/></marker></defs>
<rect class="bg" width="1150" height="740"/><text class="h" x="575" y="45" text-anchor="middle">INSURA — Component Diagram</text>
<rect class="box" x="50" y="125" width="260" height="170" rx="14"/><text class="t" x="180" y="160" text-anchor="middle">Browser Frontend</text><text class="s" x="75" y="200">Home / login / chat / dashboard</text><text class="s" x="75" y="230">Fetch API calls; local username</text><text class="s" x="75" y="260">Browser speech input / playback</text>
<rect class="box" x="390" y="95" width="350" height="230" rx="14"/><text class="t" x="565" y="130" text-anchor="middle">Flask Application</text><text class="s" x="415" y="175">/chat and audio delivery</text><text class="s" x="415" y="205">Enrollment state and business flow</text><text class="s" x="415" y="235">Dashboard REST blueprint</text><text class="s" x="415" y="265">JSON responses and error handling</text><text class="s" x="415" y="295">CORS configured for API routes</text>
<rect class="box" x="820" y="90" width="270" height="125" rx="14"/><text class="t" x="955" y="125" text-anchor="middle">Ollama</text><text class="s" x="845" y="160">llama3.2 answer generation</text><text class="s" x="845" y="188">with retrieved context</text>
<rect class="box" x="820" y="255" width="270" height="125" rx="14"/><text class="t" x="955" y="290" text-anchor="middle">Policy Retrieval</text><text class="s" x="845" y="325">Chroma vector database</text><text class="s" x="845" y="353">LIC policy workbook/index</text>
<rect class="box" x="390" y="430" width="350" height="130" rx="14"/><text class="t" x="565" y="465" text-anchor="middle">Speech Output</text><text class="s" x="415" y="505">TTS creates optional audio file</text><text class="s" x="415" y="535">Flask serves /audio/&lt;filename&gt;</text>
<rect class="data" x="50" y="430" width="260" height="145" rx="14"/><text class="t" x="180" y="465" text-anchor="middle">SQLite Dashboard DB</text><text class="s" x="75" y="505">Customers, policies, chat</text><text class="s" x="75" y="535">recommendations, notifications</text><text class="s" x="75" y="560">and document metadata</text>
<rect class="data" x="820" y="460" width="270" height="115" rx="14"/><text class="t" x="955" y="495" text-anchor="middle">Enrollment Workbook</text><text class="s" x="845" y="535">Customer enrollment records</text><text class="s" x="845" y="558">(local Excel output)</text>
<g class="edge"><path d="M310 205h80M740 155h80M740 275h80M565 325v105M390 490H310M740 500h80M565 430V325"/></g>
<text class="s" x="575" y="665" text-anchor="middle">The repo configures a local application flow; no external LIC enrollment or payment gateway is shown.</text></svg>
