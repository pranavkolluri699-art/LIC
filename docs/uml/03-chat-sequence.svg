<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">INSURA chat sequence diagram</title><desc id="desc">Question flow through browser, Flask, retrieval, Ollama, text to speech, and storage.</desc>
<defs><style>.bg{fill:#f8fafc}.head{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.msg{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#a)}.ret{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#b)}.t{font:16px Arial;fill:#172554}.h{font:bold 25px Arial;fill:#0f172a}.box{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#2563eb"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#64748b"/></marker></defs>
<rect class="bg" width="1200" height="750"/><text class="h" x="600" y="42" text-anchor="middle">INSURA — Chat Request Sequence</text>
<g class="head"><rect x="35" y="75" width="145" height="55" rx="10"/><rect x="235" y="75" width="145" height="55" rx="10"/><rect x="445" y="75" width="145" height="55" rx="10"/><rect x="655" y="75" width="145" height="55" rx="10"/><rect x="865" y="75" width="145" height="55" rx="10"/><rect x="1055" y="75" width="120" height="55" rx="10"/></g>
<g class="t" text-anchor="middle"><text x="107" y="109">Browser UI</text><text x="307" y="109">Flask /chat</text><text x="517" y="109">Policy RAG</text><text x="727" y="109">Ollama</text><text x="937" y="109">TTS</text><text x="1115" y="109">SQLite</text></g>
<path class="life" d="M107 130v560M307 130v560M517 130v560M727 130v560M937 130v560M1115 130v560"/>
<path class="msg" d="M107 180h200M307 235h210M517 290h210M727 345h210M307 455h808M937 520h-630M307 580H107"/>
<g class="t"><text x="115" y="168">POST question, username, session_id</text><text x="315" y="223">retrieve policy context</text><text x="525" y="278">context (or empty)</text><text x="735" y="333">answer</text><text x="315" y="443">save user and assistant turns (if username supplied)</text><text x="645" y="508">generate speech (best effort)</text><text x="115" y="568">answer, audio filename, session_id</text></g>
<rect class="box" x="210" y="605" width="780" height="72" rx="12"/><text class="t" x="600" y="633" text-anchor="middle">If enrollment is active, Flask collects name → age → phone → email,</text><text class="t" x="600" y="657" text-anchor="middle">then writes the enrollment workbook and optionally syncs SQLite instead of the RAG answer path.</text>
<text class="t" x="600" y="715" text-anchor="middle">TTS failure does not prevent the text answer from being returned.</text></svg>
