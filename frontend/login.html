
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insura Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: #0056b3;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #003d82;
        }

        #message {
            color: red;
            margin-top: 10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Insura Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter Username">

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <br><br>

        <button onclick="login()">
            Login
        </button>

        <br><br>

        <button onclick="window.location.href='/home'">
            Back to Home
        </button>

        <p id="message"></p>

    </div>

    <script>

        function login() {

            let username =
                document.getElementById(
                    "username"
                ).value;

            let password =
                document.getElementById(
                    "password"
                ).value;

            if (
                username === "admin" &&
                password === "12345"
            ) {

                localStorage.setItem(
                    "username",
                    username
                );

                window.location.href = "/home";

            }

            else {

                document.getElementById(
                    "message"
                ).innerHTML =
                    "Invalid Username or Password";

            }

        }

    </script>

</body>

</html>
