<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insura – AI Insurance Assistant</title>

  <!-- =====================================================================
       STYLES
  ====================================================================== -->
  <style>
    /* ---- Reset / Base -------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:       #0056b3;
      --brand-dark:  #003d82;
      --brand-light: #e8f0fe;
      --bg:          #f0f4f9;
      --surface:     #ffffff;
      --border:      #d0d7e3;
      --text:        #1a1a2e;
      --text-muted:  #6b7280;
      --user-bubble: #d9ecff;
      --bot-bubble:  #f1f3f6;
      --radius:      14px;
      --shadow:      0 4px 24px rgba(0,0,0,.10);
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    /* ---- Header -------------------------------------------------------- */
    .header {
      width: 100%;
      max-width: 780px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .header-logo {
      width: 48px;
      height: 48px;
      background: var(--brand);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brand);
      line-height: 1.2;
    }

    .header-title p {
      font-size: .82rem;
      color: var(--text-muted);
    }

    /* ---- Main card ----------------------------------------------------- */
    .card {
      width: 100%;
      max-width: 780px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- Status bar ---------------------------------------------------- */
    .status-bar {
      padding: 10px 20px;
      background: var(--brand);
      color: white;
      font-size: .82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: .02em;
      min-height: 40px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      transition: background .3s;
    }

    .status-bar[data-state="listening"]  .status-dot { background: #4ade80; animation: pulse 1.2s infinite; }
    .status-bar[data-state="thinking"]   .status-dot { background: #facc15; animation: pulse .8s infinite; }
    .status-bar[data-state="speaking"]   .status-dot { background: #60a5fa; animation: pulse 1s infinite; }
    .status-bar[data-state="idle"]       .status-dot { background: #9ca3af; animation: none; }
    .status-bar[data-state="error"]      .status-dot { background: #f87171; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .35; }
    }

    /* ---- Chat area ----------------------------------------------------- */
    .chat-area {
      flex: 1;
      height: 440px;
      overflow-y: auto;
      padding: 20px 20px 8px;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ---- Bubbles ------------------------------------------------------- */
    .bubble-row {
      display: flex;
      margin-bottom: 14px;
      gap: 10px;
    }

    .bubble-row.user  { flex-direction: row-reverse; }
    .bubble-row.bot   { flex-direction: row; }

    .avatar-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .bubble-row.user .avatar-icon { background: var(--brand-light); }
    .bubble-row.bot  .avatar-icon { background: #e8fdf0; }

    .bubble {
      max-width: 74%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: .92rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .bubble-row.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }

    .bubble-row.bot .bubble {
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    /* Thinking dots */
    .thinking-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      margin: 0 2px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce .9s infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: .15s; }
    .thinking-dots span:nth-child(3) { animation-delay: .30s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ---- Voice visualiser (waveform bars) ------------------------------ */
    .wave-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 40px;
      padding: 8px 0;
    }

    .wave-bar {
      width: 4px;
      border-radius: 3px;
      background: var(--brand);
      opacity: 0;
      transition: opacity .2s;
    }

    .wave-bar.active {
      opacity: 1;
      animation: wave 1s ease-in-out infinite;
    }

    .wave-bar:nth-child(1) { animation-delay: 0s;    height: 12px; }
    .wave-bar:nth-child(2) { animation-delay: .1s;   height: 22px; }
    .wave-bar:nth-child(3) { animation-delay: .2s;   height: 32px; }
    .wave-bar:nth-child(4) { animation-delay: .1s;   height: 22px; }
    .wave-bar:nth-child(5) { animation-delay: 0s;    height: 12px; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50%       { transform: scaleY(.4); }
    }

    /* ---- Input row ----------------------------------------------------- */
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .text-input {
      flex: 1;
      padding: 11px 16px;
      font-size: .92rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color .2s;
      color: var(--text);
      background: var(--bg);
    }

    .text-input:focus { border-color: var(--brand); }
    .text-input::placeholder { color: var(--text-muted); }

    .btn {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: .88rem;
      font-weight: 600;
      padding: 11px 18px;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:active { transform: scale(.96); }

    .btn-send {
      background: var(--brand);
      color: white;
    }
    .btn-send:hover { background: var(--brand-dark); }
    .btn-send:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    .btn-mic {
      background: var(--brand-light);
      color: var(--brand);
      min-width: 44px;
      justify-content: center;
    }
    .btn-mic:hover { background: #c7d8f8; }
    .btn-mic.active {
      background: #fee2e2;
      color: #dc2626;
      animation: micPulse 1.5s infinite;
    }

    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,.4); }
      50%       { box-shadow: 0 0 0 7px rgba(220,38,38,0); }
    }

    /* ---- Controls row -------------------------------------------------- */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 14px;
      gap: 8px;
    }

    .wave-container { flex: 1; }

    .btn-stop-speak {
      background: #fff3cd;
      color: #92400e;
      font-size: .8rem;
      padding: 7px 14px;
      border-radius: 8px;
      display: none;
    }

    .btn-stop-speak.visible { display: flex; }
    .btn-stop-speak:hover { background: #fde68a; }

    /* ---- Responsive ---------------------------------------------------- */
    @media (max-width: 500px) {
      .bubble { max-width: 88%; }
      .btn span { display: none; }
    }
  </style>
</head>

<body>

  <!-- ====================================================================
       HEADER
  ===================================================================== -->
  <div class="header">
    <div class="header-logo">🛡️</div>
    <div class="header-title">
      <h1>Insura</h1>
      <p>AI-Powered LIC Insurance Assistant</p>
    </div>
  </div>

  <!-- ====================================================================
       MAIN CARD
  ===================================================================== -->
  <div class="card">

    <!-- Status bar -->
    <div class="status-bar" id="statusBar" data-state="idle">
      <div class="status-dot"></div>
      <span id="statusText">Ready — click the microphone or type a question</span>
    </div>

    <!-- Chat messages -->
    <div class="chat-area" id="chatArea">
      <!-- Welcome message injected by JS -->
    </div>

    <!-- Controls -->
    <div class="controls-row">
      <div class="wave-container" id="waveContainer">
        <div class="wave-bar" id="w1"></div>
        <div class="wave-bar" id="w2"></div>
        <div class="wave-bar" id="w3"></div>
        <div class="wave-bar" id="w4"></div>
        <div class="wave-bar" id="w5"></div>
      </div>
      <button class="btn btn-stop-speak" id="btnStopSpeaking" onclick="InsuraAgent.stopSpeaking()">
        ⏹ Stop speaking
      </button>
    </div>

    <!-- Text input -->
    <div class="input-row">
      <input
        type="text"
        id="textInput"
        class="text-input"
        placeholder="Type a question about LIC policies…"
        autocomplete="off"
      />
      <button class="btn btn-mic" id="btnMic" onclick="InsuraAgent.toggleMic()" title="Toggle microphone">
        🎤
      </button>
      <button class="btn btn-send" id="btnSend" onclick="InsuraAgent.sendText()">
        <span>Send</span> ➤
      </button>
    </div>

  </div><!-- /.card -->


  <!-- ====================================================================
       JAVASCRIPT  —  InsuraAgent namespace
  ===================================================================== -->
  <script>
  "use strict";

  // ==========================================================================
  //  CONFIGURATION
  // ==========================================================================

  const CONFIG = {
    backendUrl:   window.location.origin,
    recognition: {
      lang:             "en-US",
      interimResults:   false,
      continuous:       false,   // We restart manually for full lifecycle control
      maxSilenceMs:     8000,    // stop listening after 8s of silence
    },
  };

  // ==========================================================================
  //  STATE MACHINE
  //
  //  States:  IDLE | LISTENING | THINKING | SPEAKING
  //
  //  Transitions:
  //    IDLE       -> LISTENING  (user clicks mic)
  //    LISTENING  -> THINKING   (speech recognised)
  //    LISTENING  -> IDLE       (mic off / error)
  //    THINKING   -> SPEAKING   (audio received)
  //    THINKING   -> LISTENING  (no audio / error)
  //    SPEAKING   -> LISTENING  (audio ended, mic was on)
  //    SPEAKING   -> IDLE       (audio ended, mic was off)
  // ==========================================================================

  const State = Object.freeze({
    IDLE:      "idle",
    LISTENING: "listening",
    THINKING:  "thinking",
    SPEAKING:  "speaking",
  });

  // ==========================================================================
  //  InsuraAgent  —  main controller object
  // ==========================================================================

  const InsuraAgent = (() => {

    // -------------------------------------------------------------------------
    //  Private state
    // -------------------------------------------------------------------------

    let _state          = State.IDLE;
    let _micEnabled     = false;          // user's intent (toggle)
    let _sessionId      = null;           // assigned in init() after helpers are defined
    let _recognition    = null;           // SpeechRecognition instance
    let _recogRunning   = false;          // guard against double .start()
    let _silenceTimer   = null;
    let _currentAudio   = null;           // current HTMLAudioElement
    let _thinkingBubble = null;           // the animated "..." bubble DOM node
    let _pendingRequest = null;           // AbortController for in-flight fetch

    // -------------------------------------------------------------------------
    //  Initialise
    // -------------------------------------------------------------------------

    function init() {
      _sessionId = _generateUUID();   // safe here — _generateUUID is already defined
      _setupRecognition();
      _appendBotBubble(
        "Hello 👋  I'm Insura, your LIC Insurance Assistant.\n\n" +
        "I can help you with:\n" +
        "• Policy explanations\n• Policy recommendations\n" +
        "• Plan comparisons\n• Customer enrollment\n\n" +
        "Click the microphone or type your question to get started."
      );
      _setStatus(State.IDLE, "Ready — click the microphone or type a question");

      // Keyboard: Enter sends text
      document.getElementById("textInput")
        .addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });
    }

    // -------------------------------------------------------------------------
    //  Speech Recognition setup
    // -------------------------------------------------------------------------

    function _setupRecognition() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        _warn("Web Speech API not supported in this browser. Voice input disabled.");
        document.getElementById("btnMic").disabled = true;
        document.getElementById("btnMic").title = "Voice not supported in this browser";
        return;
      }

      _recognition = new SpeechRecognition();
      _recognition.lang            = CONFIG.recognition.lang;
      _recognition.interimResults  = CONFIG.recognition.interimResults;
      _recognition.continuous      = CONFIG.recognition.continuous;
      _recognition.maxAlternatives = 1;

      // ---- onresult -------------------------------------------------------
      _recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim();
        if (!transcript) return;

        console.log("[Recognition] Heard:", transcript);
        _stopSilenceTimer();

        // Barge-in: if AI is speaking, stop it immediately
        if (_state === State.SPEAKING) {
          _stopAudio();
        }

        // Show what was heard in the input box briefly
        document.getElementById("textInput").value = transcript;

        // Fire the query
        _submitQuery(transcript);
      };

      // ---- onerror --------------------------------------------------------
      _recognition.onerror = (event) => {
        _recogRunning = false;
        console.warn("[Recognition] Error:", event.error);

        if (event.error === "aborted") return;          // we aborted intentionally
        if (event.error === "no-speech") {
          // Silence timeout — restart if mic is still on
          _restartRecognitionIfEnabled();
          return;
        }
        if (event.error === "not-allowed") {
          _micEnabled = false;
          _setMicButton(false);
          _setStatus(State.IDLE, "Microphone permission denied");
          return;
        }
        // Any other error — attempt restart
        _restartRecognitionIfEnabled();
      };

      // ---- onend ----------------------------------------------------------
      _recognition.onend = () => {
        _recogRunning = false;
        _stopSilenceTimer();
        console.log("[Recognition] Ended. state=%s micEnabled=%s", _state, _micEnabled);

        // Only restart when we are in LISTENING state
        // (THINKING and SPEAKING will call _startRecognition() themselves when ready)
        if (_state === State.LISTENING && _micEnabled) {
          _startRecognition();
        }
      };
    }

    // -------------------------------------------------------------------------
    //  Recognition lifecycle helpers
    // -------------------------------------------------------------------------

    function _startRecognition() {
      if (!_recognition)       return;
      if (!_micEnabled)        return;
      if (_recogRunning)       return;          // never double-start
      if (_state === State.THINKING) return;    // wait for response first
      if (_state === State.SPEAKING) return;    // wait for audio to finish

      try {
        _setState(State.LISTENING);         // set state BEFORE .start() so onend sees it
        _setStatus(State.LISTENING, "🎤 Listening…");
        _recogRunning = true;
        _recognition.start();
        _startSilenceTimer();
        console.log("[Recognition] Started.");
      } catch (err) {
        _recogRunning = false;
        console.error("[Recognition] Start failed:", err);
      }
    }

    function _stopRecognition() {
      _stopSilenceTimer();
      if (!_recognition || !_recogRunning) return;
      try {
        _recognition.abort();     // abort = immediate, stop = wait for result
        _recogRunning = false;
        console.log("[Recognition] Aborted.");
      } catch (err) {
        console.warn("[Recognition] Abort error:", err);
      }
    }

    function _restartRecognitionIfEnabled() {
      if (_micEnabled && _state !== State.THINKING && _state !== State.SPEAKING) {
        setTimeout(_startRecognition, 200);    // brief pause before restart
      }
    }

    // -------------------------------------------------------------------------
    //  Silence timer  (auto-stop after CONFIG.recognition.maxSilenceMs)
    // -------------------------------------------------------------------------

    function _startSilenceTimer() {
      _stopSilenceTimer();
      _silenceTimer = setTimeout(() => {
        if (_state === State.LISTENING) {
          _stopRecognition();
          // onend will restart it
        }
      }, CONFIG.recognition.maxSilenceMs);
    }

    function _stopSilenceTimer() {
      if (_silenceTimer) { clearTimeout(_silenceTimer); _silenceTimer = null; }
    }

    // -------------------------------------------------------------------------
    //  Audio playback
    // -------------------------------------------------------------------------

    function _playAudio(filename) {
      // Cancel any previous audio
      _stopAudio();

      const url = `${CONFIG.backendUrl}/audio/${filename}`;
      const audio = new Audio();
      _currentAudio = audio;

      _setState(State.SPEAKING);
      _setStatus(State.SPEAKING, "🔊 Speaking…");
      _setWave(true);
      document.getElementById("btnStopSpeaking").classList.add("visible");
      _stopRecognition();   // mic off while speaking

      // Capture a reference so stale events from replaced audio are ignored
      const thisAudio = audio;

      audio.onended = () => {
        if (_currentAudio !== thisAudio) return;   // already replaced
        _onAudioFinished();
      };
      audio.onerror = (e) => {
        if (_currentAudio !== thisAudio) return;
        console.error("[Audio] Error loading:", url, e);
        _onAudioFinished();
      };

      // Set src and attempt play — don't rely on oncanplaythrough
      // (some browsers/servers skip that event entirely)
      audio.src = url;
      audio.load();
      audio.play().catch(err => {
        if (_currentAudio !== thisAudio) return;
        console.error("[Audio] play() rejected:", err);
        _onAudioFinished();
      });
    }

    function _onAudioFinished() {
      _currentAudio = null;
      _setWave(false);
      document.getElementById("btnStopSpeaking").classList.remove("visible");
      console.log("[Audio] Finished. micEnabled=%s", _micEnabled);

      if (_micEnabled) {
        _setState(State.LISTENING);
        setTimeout(_startRecognition, 300);   // small gap before mic opens
      } else {
        _setState(State.IDLE);
        _setStatus(State.IDLE, "Ready — click the microphone or type a question");
      }
    }

    function _stopAudio() {
      if (_currentAudio) {
        try {
          _currentAudio.pause();
          _currentAudio.src = "";
        } catch (_) {}
        _currentAudio = null;
      }
      _setWave(false);
      document.getElementById("btnStopSpeaking").classList.remove("visible");
    }

    // -------------------------------------------------------------------------
    //  Query submission  (shared by voice and text paths)
    // -------------------------------------------------------------------------

    async function _submitQuery(question) {
      if (!question.trim()) return;

      // Cancel any in-flight request
      if (_pendingRequest) {
        _pendingRequest.abort();
        _pendingRequest = null;
      }

      // Stop listening while thinking
      _stopRecognition();
      _setState(State.THINKING);
      _setStatus(State.THINKING, "⏳ Thinking…");

      // Clear the text input
      document.getElementById("textInput").value = "";

      // Show user bubble
      _appendUserBubble(question);

      // Show animated thinking indicator
      _thinkingBubble = _appendThinkingBubble();

      const controller = new AbortController();
      _pendingRequest = controller;

      try {
        // Include username so the backend can persist chat turns
        // to the dashboard DB.  Falls back to empty string gracefully.
        const _username = localStorage.getItem("username") || "";

        const response = await fetch(`${CONFIG.backendUrl}/chat`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({
            question,
            session_id: _sessionId,
            username:   _username,
          }),
          signal:  controller.signal,
        });

        const data = await response.json();
        _pendingRequest = null;

        // Replace thinking bubble with actual answer
        _removeThinkingBubble();
        if (!response.ok) {
          _appendBotBubble(data.answer || "The policy assistant is temporarily unavailable. Please try again.");
          _setStatus(State.IDLE, "⚠️ Assistant unavailable");
          _setState(State.IDLE);
          return;
        }
        _appendBotBubble(data.answer || "Sorry, I didn't get a response.");

        if (data.audio) {
          _playAudio(data.audio);
        } else {
          // No audio — go back to listening / idle
          if (_micEnabled) {
            _setState(State.LISTENING);
            setTimeout(_startRecognition, 300);
          } else {
            _setState(State.IDLE);
            _setStatus(State.IDLE, "Ready");
          }
        }

      } catch (err) {
        _pendingRequest = null;
        _removeThinkingBubble();

        if (err.name === "AbortError") {
          console.log("[Fetch] Request aborted (new question arrived).");
          return;
        }

        console.error("[Fetch] Error:", err);
        const errMsg = "Sorry, I couldn't reach the server. Please check that the backend is running.";
        _appendBotBubble(errMsg);
        _setStatus(State.IDLE, "⚠️ Connection error");

        if (_micEnabled) {
          _setState(State.LISTENING);
          setTimeout(_startRecognition, 500);
        } else {
          _setState(State.IDLE);
        }
      }
    }

    // -------------------------------------------------------------------------
    //  Public: send text from input box
    // -------------------------------------------------------------------------

    function sendText() {
      const question = document.getElementById("textInput").value.trim();
      if (!question) return;
      _submitQuery(question);
    }

    // -------------------------------------------------------------------------
    //  Public: toggle microphone
    // -------------------------------------------------------------------------

    function toggleMic() {
      _micEnabled = !_micEnabled;
      _setMicButton(_micEnabled);

      if (_micEnabled) {
        _startRecognition();
      } else {
        _stopRecognition();
        if (_state === State.LISTENING) {
          _setState(State.IDLE);
          _setStatus(State.IDLE, "Microphone off");
        }
      }
    }

    // -------------------------------------------------------------------------
    //  Public: stop speaking (barge-in button)
    // -------------------------------------------------------------------------

    function stopSpeaking() {
      _stopAudio();
      if (_micEnabled) {
        _setState(State.LISTENING);
        setTimeout(_startRecognition, 200);
      } else {
        _setState(State.IDLE);
        _setStatus(State.IDLE, "Ready");
      }
    }

    // -------------------------------------------------------------------------
    //  UI helpers
    // -------------------------------------------------------------------------

    function _setState(s) {
      _state = s;
    }

    function _setStatus(state, msg) {
      const bar  = document.getElementById("statusBar");
      const text = document.getElementById("statusText");
      bar.dataset.state = state;
      text.textContent  = msg;
    }

    function _setMicButton(on) {
      const btn = document.getElementById("btnMic");
      btn.textContent = on ? "🔴" : "🎤";
      btn.title       = on ? "Click to turn off microphone" : "Click to turn on microphone";
      btn.classList.toggle("active", on);
    }

    function _setWave(on) {
      const bars = document.querySelectorAll(".wave-bar");
      bars.forEach(b => b.classList.toggle("active", on));
    }

    // ---- Chat bubbles ---------------------------------------------------

    function _appendUserBubble(text) {
      _appendBubble(text, "user", "👤");
    }

    function _appendBotBubble(text) {
      _appendBubble(text, "bot", "🛡️");
    }

    function _appendBubble(text, who, icon) {
      const chatArea = document.getElementById("chatArea");

      const row = document.createElement("div");
      row.className = `bubble-row ${who}`;

      const av = document.createElement("div");
      av.className   = "avatar-icon";
      av.textContent = icon;

      const bubble = document.createElement("div");
      bubble.className   = "bubble";
      // Preserve newlines
      bubble.style.whiteSpace = "pre-wrap";
      bubble.textContent = text;

      row.appendChild(av);
      row.appendChild(bubble);
      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
      return row;
    }

    function _appendThinkingBubble() {
      const chatArea = document.getElementById("chatArea");

      const row = document.createElement("div");
      row.className = "bubble-row bot";
      row.id = "thinkingBubble";

      const av = document.createElement("div");
      av.className   = "avatar-icon";
      av.textContent = "🛡️";

      const bubble = document.createElement("div");
      bubble.className = "bubble thinking-dots";
      bubble.innerHTML = "<span></span><span></span><span></span>";

      row.appendChild(av);
      row.appendChild(bubble);
      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
      return row;
    }

    function _removeThinkingBubble() {
      const el = document.getElementById("thinkingBubble");
      if (el) el.remove();
      _thinkingBubble = null;
    }

    // ---- Utility --------------------------------------------------------

    function _warn(msg) {
      console.warn("[Insura]", msg);
      _appendBotBubble("⚠️ " + msg);
    }

    function _generateUUID() {
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    // -------------------------------------------------------------------------
    //  Public interface
    // -------------------------------------------------------------------------

    return { init, toggleMic, sendText, stopSpeaking };

  })(); // InsuraAgent IIFE


  // Boot on DOM ready
  document.addEventListener("DOMContentLoaded", () => InsuraAgent.init());

  </script>
</body>
</html>
