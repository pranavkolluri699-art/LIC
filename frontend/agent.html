<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insura – AI Insurance Assistant</title>

  <!-- =====================================================================
       STYLES
  ====================================================================== -->
  <style>
    /* ---- Reset / Base -------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:       #0056b3;
      --brand-dark:  #003d82;
      --brand-light: #e8f0fe;
      --bg:          #f0f4f9;
      --surface:     #ffffff;
      --border:      #d0d7e3;
      --text:        #1a1a2e;
      --text-muted:  #6b7280;
      --user-bubble: #d9ecff;
      --bot-bubble:  #f1f3f6;
      --radius:      14px;
      --shadow:      0 4px 24px rgba(0,0,0,.10);
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    /* ---- Header -------------------------------------------------------- */
    .header {
      width: 100%;
      max-width: 1320px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .header-logo {
      width: 48px;
      height: 48px;
      background: var(--brand);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brand);
      line-height: 1.2;
    }

    .header-title p {
      font-size: .82rem;
      color: var(--text-muted);
    }

/* ---- Main card and two-column workspace --------------------------- */
    .card {
      width: 100%;
      max-width: 1320px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .workspace-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(270px, 31%);
      align-items: stretch;
      gap: 16px;
      min-height: 612px;
      padding: 16px;
      background: var(--bg);
    }

    .conversation-column {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 580px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    /* ---- Real-time digital avatar ------------------------------------- */
    .avatar-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 14px;
      min-width: 0;
      min-height: 580px;
      padding: 20px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }
    .avatar-toolbar { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .avatar-caption { color: var(--text-muted); font-size: .82rem; text-align: center; }
    .avatar-connect-btn { border: 0; border-radius: 8px; padding: 8px 12px; color: #fff; background: var(--brand); cursor: pointer; font-size: .82rem; }
    .avatar-connect-btn:hover { background: var(--brand-dark); }
    .avatar-video { display: none; width: min(100%, 360px); aspect-ratio: 1; max-height: 380px; margin: 0 auto; background: #111827; border-radius: 12px; object-fit: contain; }
    .avatar-video.visible { display: block; }
    /* ---- Status bar ---------------------------------------------------- */
    .status-bar {
      padding: 10px 20px;
      background: var(--brand);
      color: white;
      font-size: .82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: .02em;
      min-height: 40px;
    }

    .query-timer {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-left: 6px;
      padding: 4px 8px;
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      color: var(--text-muted);
      font-size: .72rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      visibility: hidden;
    }

    .query-timer[data-running="true"] { visibility: visible; }

    .query-timer .timer-indicator {
      width: 12px;
      height: 12px;
      box-sizing: border-box;
      border: 2px solid rgba(15, 23, 42, .18);
      border-top-color: var(--brand);
      border-radius: 50%;
      flex: 0 0 12px;
    }

    .query-timer[data-running="true"] .timer-indicator {
      animation: timer-spin .8s linear infinite;
    }

    .thinking-bubble { display: flex; align-items: center; gap: 10px; }

    @keyframes timer-spin { to { transform: rotate(360deg); } }

    .response-time-note {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: .72rem;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      transition: background .3s;
    }

    .status-bar[data-state="listening"]  .status-dot { background: #4ade80; animation: pulse 1.2s infinite; }
    .status-bar[data-state="thinking"]   .status-dot { background: #facc15; animation: pulse .8s infinite; }
    .status-bar[data-state="speaking"]   .status-dot { background: #60a5fa; animation: pulse 1s infinite; }
    .status-bar[data-state="idle"]       .status-dot { background: #9ca3af; animation: none; }
    .status-bar[data-state="error"]      .status-dot { background: #f87171; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .35; }
    }

    /* ---- Chat area ----------------------------------------------------- */
    .chat-area {
      flex: 1 1 440px;
      min-height: 0;
      height: 440px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 20px 20px 8px;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }

    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ---- Bubbles ------------------------------------------------------- */
    .bubble-row {
      display: flex;
      margin-bottom: 14px;
      gap: 10px;
    }

    .bubble-row.user  { flex-direction: row-reverse; }
    .bubble-row.bot   { flex-direction: row; }

    .avatar-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .bubble-row.user .avatar-icon { background: var(--brand-light); }
    .bubble-row.bot  .avatar-icon { background: #e8fdf0; }

    .bubble {
      max-width: 74%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: .92rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .bubble-row.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }

    .bubble-row.bot .bubble {
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }
    .comparison-table-wrap {
      max-width: 100%;
      overflow-x: auto;
      margin: 8px 0;
    }
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .86rem;
      background: rgba(255, 255, 255, .55);
    }
    .comparison-table th, .comparison-table td {
      border: 1px solid rgba(20, 65, 120, .18);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      min-width: 130px;
    }
    .comparison-table th { background: rgba(20, 90, 170, .10); }

    /* Thinking dots */
    .thinking-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      margin: 0 2px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce .9s infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: .15s; }
    .thinking-dots span:nth-child(3) { animation-delay: .30s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ---- Voice visualiser (waveform bars) ------------------------------ */
    .wave-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 40px;
      padding: 8px 0;
    }

    .wave-bar {
      width: 4px;
      border-radius: 3px;
      background: var(--brand);
      opacity: 0;
      transition: opacity .2s;
    }

    .wave-bar.active {
      opacity: 1;
      animation: wave 1s ease-in-out infinite;
    }

    .wave-bar:nth-child(1) { animation-delay: 0s;    height: 12px; }
    .wave-bar:nth-child(2) { animation-delay: .1s;   height: 22px; }
    .wave-bar:nth-child(3) { animation-delay: .2s;   height: 32px; }
    .wave-bar:nth-child(4) { animation-delay: .1s;   height: 22px; }
    .wave-bar:nth-child(5) { animation-delay: 0s;    height: 12px; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50%       { transform: scaleY(.4); }
    }

    /* ---- Input row ----------------------------------------------------- */
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .text-input {
      flex: 1;
      padding: 11px 16px;
      font-size: .92rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color .2s;
      color: var(--text);
      background: var(--bg);
    }

    .text-input:focus { border-color: var(--brand); }
    .text-input::placeholder { color: var(--text-muted); }

    .btn {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: .88rem;
      font-weight: 600;
      padding: 11px 18px;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:active { transform: scale(.96); }

    .btn-send {
      background: var(--brand);
      color: white;
    }
    .btn-send:hover { background: var(--brand-dark); }
    .btn-send:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    .btn-mic {
      background: var(--brand-light);
      color: var(--brand);
      min-width: 44px;
      justify-content: center;
    }
    .btn-mic:hover { background: #c7d8f8; }
    .btn-mic.active {
      background: #fee2e2;
      color: #dc2626;
      animation: micPulse 1.5s infinite;
    }

    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,.4); }
      50%       { box-shadow: 0 0 0 7px rgba(220,38,38,0); }
    }

    /* ---- Controls row -------------------------------------------------- */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 14px;
      gap: 8px;
    }

    .wave-container { flex: 1; }

    .btn-stop-speak {
      background: #fff3cd;
      color: #92400e;
      font-size: .8rem;
      padding: 7px 14px;
      border-radius: 8px;
      display: none;
    }

    .btn-stop-speak.visible { display: flex; }
    .btn-stop-speak:hover { background: #fde68a; }

    /* ---- Responsive ---------------------------------------------------- */
    @media (max-width: 760px) {
      body { padding: 16px 10px 24px; }
      .workspace-layout { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px; }
      .conversation-column { min-height: 0; }
      .avatar-panel { min-height: 250px; }
      .avatar-video { width: min(100%, 320px); max-height: 320px; }
      .chat-area { height: 420px; }
    }
    @media (max-width: 500px) {
      .bubble { max-width: 88%; }
      .btn span { display: none; }
    }
  </style>
</head>

<body>

  <!-- ====================================================================
       HEADER
  ===================================================================== -->
  <div class="header">
    <div class="header-logo">🛡️</div>
    <div class="header-title">
      <h1>Insura</h1>
      <p>AI-Powered LIC Insurance Assistant</p>
    </div>
  </div>

  <!-- ====================================================================
       MAIN CARD
  ===================================================================== -->
  <div class="card">
    <div class="workspace-layout">
      <section class="conversation-column" aria-label="Chat with Insura">
        <!-- Status bar -->
        <div class="status-bar" id="statusBar" data-state="idle">
          <div class="status-dot"></div>
          <span id="statusText">Ready — click the microphone or type a question</span>
        </div>

        <!-- Chat messages -->
        <div class="chat-area" id="chatArea">
          <!-- Welcome message injected by JS -->
        </div>

        <!-- Controls -->
        <div class="controls-row">
          <div class="wave-container" id="waveContainer">
            <div class="wave-bar" id="w1"></div>
            <div class="wave-bar" id="w2"></div>
            <div class="wave-bar" id="w3"></div>
            <div class="wave-bar" id="w4"></div>
            <div class="wave-bar" id="w5"></div>
          </div>
          <button class="btn btn-stop-speak" id="btnStopSpeaking" onclick="InsuraAgent.stopSpeaking()">
            ⏹ Stop speaking
          </button>
        </div>

        <!-- Text input -->
        <div class="input-row">
          <input
            type="text"
            id="textInput"
            class="text-input"
            placeholder="Type a question about LIC policies…"
            autocomplete="off"
            spellcheck="true"
            autocorrect="on"
          />
          <button class="btn btn-mic" id="btnMic" onclick="InsuraAgent.toggleMic()" title="Toggle microphone">
            🎤
          </button>
          <button class="btn btn-send" id="btnSend" onclick="InsuraAgent.sendText()">
            <span>Send</span> ➤
          </button>
        </div>
      </section>

      <aside class="avatar-panel" aria-label="Talking avatar">
        <div class="avatar-toolbar">
          <span class="avatar-caption" id="avatarStatus">Talking avatar is disconnected</span>
          <button type="button" class="avatar-connect-btn" id="btnConnectAvatar" onclick="InsuraAgent.toggleAvatar()">Connect avatar</button>
        </div>
        <video id="insuraAvatarVideo" class="avatar-video" autoplay playsinline muted aria-label="Insura talking avatar"></video>
      </aside>
    </div>
  </div><!-- /.card -->


  <!-- ====================================================================
       JAVASCRIPT  —  InsuraAgent namespace
  ===================================================================== -->
  <script>
  "use strict";

  // ==========================================================================
  //  CONFIGURATION
  // ==========================================================================

  const CONFIG = {
    backendUrl:   window.location.origin,
    avatarUrl:    "http://127.0.0.1:8010",
    recognition: {
      lang:             "en-US",
      interimResults:   false,
      continuous:       false,   // We restart manually for full lifecycle control
      maxSilenceMs:     8000,    // stop listening after 8s of silence
    },
  };

  // ==========================================================================
  //  STATE MACHINE
  //
  //  States:  IDLE | LISTENING | THINKING | SPEAKING
  //
  //  Transitions:
  //    IDLE       -> LISTENING  (user clicks mic)
  //    LISTENING  -> THINKING   (speech recognised)
  //    LISTENING  -> IDLE       (mic off / error)
  //    THINKING   -> SPEAKING   (audio received)
  //    THINKING   -> LISTENING  (no audio / error)
  //    SPEAKING   -> LISTENING  (audio ended, mic was on)
  //    SPEAKING   -> IDLE       (audio ended, mic was off)
  // ==========================================================================

  const State = Object.freeze({
    IDLE:      "idle",
    LISTENING: "listening",
    THINKING:  "thinking",
    SPEAKING:  "speaking",
  });

  // ==========================================================================
  //  InsuraAgent  —  main controller object
  // ==========================================================================

  const InsuraAgent = (() => {

    // -------------------------------------------------------------------------
    //  Private state
    // -------------------------------------------------------------------------

    let _state          = State.IDLE;
    let _micEnabled     = false;          // user's intent (toggle)
    let _sessionId      = null;           // assigned in init() after helpers are defined
    let _recognition    = null;           // SpeechRecognition instance
    let _recogRunning   = false;          // guard against double .start()
    let _silenceTimer   = null;
    let _currentAudio   = null;           // current HTMLAudioElement
    let _thinkingBubble = null;           // the animated "..." bubble DOM node
    let _pendingRequest = null;           // AbortController for in-flight fetch
    let _responseTimerInterval = null;
    let _responseStartedAt = null;
    let _currentUtterance = null;
    let _speechRequestToken = 0;
    let _preferredFemaleVoiceURI = null;
    let _avatarPeer = null;
    let _avatarSessionId = null;
    let _avatarConnectPromise = null;

    // -------------------------------------------------------------------------
    //  Initialise
    // -------------------------------------------------------------------------

    function init() {
      _sessionId = _generateUUID();   // safe here — _generateUUID is already defined
      _setupRecognition();
      _appendBotBubble(
        "Hello 👋  I'm Insura, your LIC Insurance Assistant.\n\n" +
        "I can help you with:\n" +
        "• Policy explanations\n• Policy recommendations\n" +
        "• Plan comparisons\n• Customer enrollment\n\n" +
        "Click the microphone or type your question to get started."
      );
      _setStatus(State.IDLE, "Ready — click the microphone or type a question");

      // Keyboard: Enter sends text
      document.getElementById("textInput")
        .addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });
    }

    // -------------------------------------------------------------------------
    //  Speech Recognition setup
    // -------------------------------------------------------------------------

    function _setupRecognition() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        _warn("Web Speech API not supported in this browser. Voice input disabled.");
        document.getElementById("btnMic").disabled = true;
        document.getElementById("btnMic").title = "Voice not supported in this browser";
        return;
      }

      _recognition = new SpeechRecognition();
      _recognition.lang            = CONFIG.recognition.lang;
      _recognition.interimResults  = CONFIG.recognition.interimResults;
      _recognition.continuous      = CONFIG.recognition.continuous;
      _recognition.maxAlternatives = 1;

      // ---- onresult -------------------------------------------------------
      _recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim();
        if (!transcript) return;

        console.log("[Recognition] Heard:", transcript);
        _stopSilenceTimer();

        // Barge-in: if AI is speaking, stop it immediately
        if (_state === State.SPEAKING) {
          _stopAudio();
        }

        // Show what was heard in the input box briefly
        document.getElementById("textInput").value = transcript;

        // Fire the query
        _submitQuery(transcript);
      };

      // ---- onerror --------------------------------------------------------
      _recognition.onerror = (event) => {
        _recogRunning = false;
        console.warn("[Recognition] Error:", event.error);

        if (event.error === "aborted") return;          // we aborted intentionally
        if (event.error === "no-speech") {
          // Silence timeout — restart if mic is still on
          _restartRecognitionIfEnabled();
          return;
        }
        if (event.error === "not-allowed") {
          _micEnabled = false;
          _setMicButton(false);
          _setStatus(State.IDLE, "Microphone permission denied");
          return;
        }
        // Any other error — attempt restart
        _restartRecognitionIfEnabled();
      };

      // ---- onend ----------------------------------------------------------
      _recognition.onend = () => {
        _recogRunning = false;
        _stopSilenceTimer();
        console.log("[Recognition] Ended. state=%s micEnabled=%s", _state, _micEnabled);

        // Only restart when we are in LISTENING state
        // (THINKING and SPEAKING will call _startRecognition() themselves when ready)
        if (_state === State.LISTENING && _micEnabled) {
          _startRecognition();
        }
      };
    }

    // -------------------------------------------------------------------------
    //  Recognition lifecycle helpers
    // -------------------------------------------------------------------------

    function _startRecognition() {
      if (!_recognition)       return;
      if (!_micEnabled)        return;
      if (_recogRunning)       return;          // never double-start
      if (_state === State.THINKING) return;    // wait for response first
      if (_state === State.SPEAKING) return;    // wait for audio to finish

      try {
        _setState(State.LISTENING);         // set state BEFORE .start() so onend sees it
        _setStatus(State.LISTENING, "🎤 Listening…");
        _recogRunning = true;
        _recognition.start();
        _startSilenceTimer();
        console.log("[Recognition] Started.");
      } catch (err) {
        _recogRunning = false;
        console.error("[Recognition] Start failed:", err);
      }
    }

    function _stopRecognition() {
      _stopSilenceTimer();
      if (!_recognition || !_recogRunning) return;
      try {
        _recognition.abort();     // abort = immediate, stop = wait for result
        _recogRunning = false;
        console.log("[Recognition] Aborted.");
      } catch (err) {
        console.warn("[Recognition] Abort error:", err);
      }
    }

    function _restartRecognitionIfEnabled() {
      if (_micEnabled && _state !== State.THINKING && _state !== State.SPEAKING) {
        setTimeout(_startRecognition, 200);    // brief pause before restart
      }
    }

    // -------------------------------------------------------------------------
    //  Silence timer  (auto-stop after CONFIG.recognition.maxSilenceMs)
    // -------------------------------------------------------------------------

    function _startSilenceTimer() {
      _stopSilenceTimer();
      _silenceTimer = setTimeout(() => {
        if (_state === State.LISTENING) {
          _stopRecognition();
          // onend will restart it
        }
      }, CONFIG.recognition.maxSilenceMs);
    }

    function _stopSilenceTimer() {
      if (_silenceTimer) { clearTimeout(_silenceTimer); _silenceTimer = null; }
    }

    // -------------------------------------------------------------------------
    //  Audio playback
    // -------------------------------------------------------------------------

    async function toggleAvatar() {
      if (_avatarPeer) {
        _disconnectAvatar();
        return;
      }
      if (_avatarConnectPromise) return _avatarConnectPromise;

      const status = document.getElementById("avatarStatus");
      const button = document.getElementById("btnConnectAvatar");
      status.textContent = "Connecting to the avatar service…";
      button.disabled = true;
      _avatarConnectPromise = (async () => {
        try {
          if (!("RTCPeerConnection" in window)) throw new Error("This browser does not support WebRTC.");
          const peer = new RTCPeerConnection({ iceServers: [] });
          _avatarPeer = peer;
          peer.addTransceiver("audio", { direction: "recvonly" });
          peer.addTransceiver("video", { direction: "recvonly" });
          peer.ontrack = event => {
            const video = document.getElementById("insuraAvatarVideo");
            video.muted = true; // Insura's answer audio plays once through the existing player.
            video.srcObject = event.streams?.[0] || new MediaStream([event.track]);
            video.classList.add("visible");
            video.play().catch(error => console.warn("[Avatar] video play blocked:", error));
          };
          peer.onconnectionstatechange = () => {
            if (peer.connectionState === "connected") {
              status.textContent = "Avatar connected — it will lip-sync Insura's spoken answers.";
              button.textContent = "Disconnect avatar";
            } else if (["failed", "disconnected"].includes(peer.connectionState)) {
              status.textContent = "Avatar connection lost. Check that its service is running.";
            }
          };

          const offer = await peer.createOffer();
          await peer.setLocalDescription(offer);
          if (peer.iceGatheringState !== "complete") {
            await new Promise(resolve => {
              const timeout = setTimeout(done, 4000);
              function done() {
                clearTimeout(timeout);
                peer.removeEventListener("icegatheringstatechange", checkIce);
                resolve();
              }
              function checkIce() {
                if (peer.iceGatheringState === "complete") done();
              }
              peer.addEventListener("icegatheringstatechange", checkIce);
            });
          }

          const response = await fetch(`${CONFIG.avatarUrl}/offer`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sdp: peer.localDescription.sdp, type: peer.localDescription.type }),
          });
          if (!response.ok) throw new Error(`Avatar service returned HTTP ${response.status}.`);
          const result = await response.json();
          if (!result.sdp || result.sessionid === undefined) throw new Error(result.msg || "Avatar service returned an invalid session.");
          _avatarSessionId = Number(result.sessionid);
          await peer.setRemoteDescription({ type: result.type, sdp: result.sdp });
          status.textContent = "Avatar session ready — waiting for video.";
          button.textContent = "Disconnect avatar";
        } catch (error) {
          console.error("[Avatar] connection failed:", error);
          status.textContent = error instanceof TypeError
            ? "Cannot reach avatar service. Install models\\wav2lip.pth, then run start-avatar.ps1."
            : `Avatar unavailable: ${error.message}`;
          _disconnectAvatar(false);
        } finally {
          button.disabled = false;
          _avatarConnectPromise = null;
        }
      })();
      return _avatarConnectPromise;
    }

    function _disconnectAvatar(updateStatus = true) {
      if (_avatarPeer) {
        try { _avatarPeer.close(); } catch (_) {}
      }
      _avatarPeer = null;
      _avatarSessionId = null;
      const video = document.getElementById("insuraAvatarVideo");
      if (video) {
        video.pause();
        video.srcObject = null;
        video.classList.remove("visible");
      }
      const button = document.getElementById("btnConnectAvatar");
      if (button) button.textContent = "Connect avatar";
      if (updateStatus) document.getElementById("avatarStatus").textContent = "Talking avatar is disconnected";
    }

    async function _sendAudioToAvatar(filename) {
      if (_avatarSessionId === null) return false;
      const sessionId = _avatarSessionId;
      try {
        const audioResponse = await fetch(`${CONFIG.backendUrl}/audio/${encodeURIComponent(filename)}`);
        if (!audioResponse.ok) throw new Error(`Could not read Insura audio (HTTP ${audioResponse.status}).`);
        const audioBlob = await audioResponse.blob();
        const form = new FormData();
        form.append("sessionid", String(sessionId));
        form.append("file", audioBlob, filename);
        const response = await fetch(`${CONFIG.avatarUrl}/humanaudio`, { method: "POST", body: form });
        const result = await response.json();
        if (!response.ok || result.code !== 0) throw new Error(result.msg || `Avatar audio sync returned HTTP ${response.status}.`);
        return _avatarSessionId === sessionId;
      } catch (error) {
        console.error("[Avatar] audio sync failed:", error);
        document.getElementById("avatarStatus").textContent = "Avatar is connected, but lip-sync failed for this answer.";
        return false;
      }
    }

    function _interruptAvatar() {
      if (_avatarSessionId === null) return;
      fetch(`${CONFIG.avatarUrl}/interrupt_talk`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionid: _avatarSessionId }),
      }).catch(error => console.warn("[Avatar] could not interrupt speech:", error));
    }

    function _playAudio(filename, fallbackText) {
      _stopAudio();

      const url = `${CONFIG.backendUrl}/audio/${filename}`;
      const audio = new Audio();
      _currentAudio = audio;

      _setState(State.SPEAKING);
      _setStatus(State.SPEAKING, "🔊 Speaking…");
      _setWave(true);
      document.getElementById("btnStopSpeaking").classList.add("visible");
      _stopRecognition();

      const thisAudio = audio;
      let playStarted = false;
      const startPlayback = () => {
        if (_currentAudio !== thisAudio || playStarted) return;
        playStarted = true;
        audio.play().catch(err => {
          if (_currentAudio !== thisAudio) return;
          console.error("[Audio] play() rejected:", err);
          _currentAudio = null;
          _speakFallback(fallbackText);
        });
      };

      audio.onended = () => {
        if (_currentAudio !== thisAudio) return;
        _onAudioFinished();
      };
      audio.onerror = (e) => {
        if (_currentAudio !== thisAudio) return;
        console.error("[Audio] Error loading:", url, e);
        _currentAudio = null;
        _speakFallback(fallbackText);
      };

      audio.src = url;
      audio.preload = "auto";
      audio.load();

      if (_avatarSessionId !== null) {
        const sessionId = _avatarSessionId;
        _sendAudioToAvatar(filename).then(accepted => {
          // Wav2Lip needs about 0.44s to emit its first speaking frame.
          // Queue the avatar audio first, then start local playback to align them.
          const leadMs = accepted && _avatarSessionId === sessionId ? 400 : 0;
          window.setTimeout(startPlayback, leadMs);
        });
      } else {
        startPlayback();
      }
    }

    async function _speakFallback(text) {
      const speech = window.speechSynthesis;
      if (!speech || typeof SpeechSynthesisUtterance === "undefined" || !text) {
        _onAudioFinished();
        return;
      }
      const speechToken = ++_speechRequestToken;
      speech.cancel();
      _setState(State.SPEAKING);
      _setStatus(State.SPEAKING, "🔊 Speaking…");
      _setWave(true);
      document.getElementById("btnStopSpeaking").classList.add("visible");
      _stopRecognition();
      const cleanText = text
        .replace(/\n\s*Sources?:[\s\S]*$/i, "")
        .replace(/^[\s]*[•◦▪*-]\s*/gm, "")
        .replace(/(?<!\d)\.(?!\d)/g, ",")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/,\s*$/, "");
      let voices = speech.getVoices();
      if (!voices.length) {
        voices = await new Promise(resolve => {
          let completed = false;
          const finish = () => {
            if (completed) return;
            completed = true;
            clearTimeout(timeoutId);
            speech.removeEventListener("voiceschanged", finish);
            resolve(speech.getVoices());
          };
          const timeoutId = setTimeout(finish, 2000);
          speech.addEventListener("voiceschanged", finish, { once: true });
        });
      }
      if (speechToken !== _speechRequestToken) return;

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = "en-IN";
      utterance.rate = 1.2;
      const preferredVoice = _preferredFemaleVoiceURI &&
        voices.find(voice => voice.voiceURI === _preferredFemaleVoiceURI);
      const femaleIndianVoice = voices.find(voice =>
        /^en[-_]IN$/i.test(voice.lang) && /aashi|aarti|ananya|kavya|neerja|heera/i.test(voice.name)
      );
      const femaleEnglishVoice = voices.find(voice =>
        /^en[-_]/i.test(voice.lang) && /female|zira|samantha|aria|jenny|heera|neerja|aashi|aarti|ananya|kavya/i.test(voice.name)
      );
      const selectedFemaleVoice = preferredVoice || femaleIndianVoice || femaleEnglishVoice;
      if (!selectedFemaleVoice) {
        console.error("[Speech] No English female voice is available in this browser.");
        _currentUtterance = null;
        _onAudioFinished();
        return;
      }
      _preferredFemaleVoiceURI = selectedFemaleVoice.voiceURI;
      utterance.voice = selectedFemaleVoice;
      console.info("[Speech] Browser voice:", selectedFemaleVoice.name);
      _currentUtterance = utterance;
      utterance.onend = () => {
        if (_currentUtterance !== utterance) return;
        _currentUtterance = null;
        _onAudioFinished();
      };
      utterance.onerror = (event) => {
        console.warn("[Speech] Browser speech failed:", event.error);
        if (_currentUtterance !== utterance) return;
        _currentUtterance = null;
        _onAudioFinished();
      };
      speech.speak(utterance);
    }

    function _onAudioFinished() {
      _currentAudio = null;
      _setWave(false);
      document.getElementById("btnStopSpeaking").classList.remove("visible");
      console.log("[Audio] Finished. micEnabled=%s", _micEnabled);

      if (_micEnabled) {
        _setState(State.LISTENING);
        setTimeout(_startRecognition, 300);   // small gap before mic opens
      } else {
        _setState(State.IDLE);
        _setStatus(State.IDLE, "Ready — click the microphone or type a question");
      }
    }

    function _stopAudio() {
      _speechRequestToken++;
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      _currentUtterance = null;
      if (_currentAudio) {
        try {
          _currentAudio.pause();
          _currentAudio.src = "";
        } catch (_) {}
        _currentAudio = null;
      }
      _setWave(false);
      document.getElementById("btnStopSpeaking").classList.remove("visible");
    }

    // -------------------------------------------------------------------------
    //  Query submission  (shared by voice and text paths)
    // -------------------------------------------------------------------------

    async function _submitQuery(question) {
      if (!question.trim()) return;
      _interruptAvatar();

      // Cancel any in-flight request
      if (_pendingRequest) {
        _pendingRequest.abort();
        _pendingRequest = null;
      }

      // Stop listening while thinking
      _stopRecognition();
      _setState(State.THINKING);
      _setStatus(State.THINKING, "⏳ Thinking…");

      // Clear the text input
      document.getElementById("textInput").value = "";

      // Show user bubble
      _appendUserBubble(question);

      // Show the thinking animation and timer beside the pending answer.
      _thinkingBubble = _appendThinkingBubble();
      _startResponseTimer();

      const controller = new AbortController();
      _pendingRequest = controller;

      try {
        // Include username so the backend can persist chat turns
        // to the dashboard DB.  Falls back to empty string gracefully.
        const _username = localStorage.getItem("username") || "";

        const response = await fetch(`${CONFIG.backendUrl}/chat`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({
            question,
            session_id: _sessionId,
            username:   _username,
          }),
          signal:  controller.signal,
        });

        const data = await response.json();
        if (_pendingRequest !== controller) return;
        _pendingRequest = null;
        const responseMs = _stopResponseTimer();

        // Replace thinking bubble with actual answer
        _removeThinkingBubble();
        if (!response.ok) {
          const errorAnswer = data.answer || "The policy assistant is temporarily unavailable. Please try again.";
          _appendBotBubble(errorAnswer, responseMs);
          _setStatus(State.IDLE, "⚠️ Assistant unavailable");
          if (data.audio) _playAudio(data.audio, errorAnswer);
          else _speakFallback(errorAnswer);
          return;
        }
        const answerText = data.answer || "Sorry, I didn't get a response.";
        _appendBotBubble(answerText, responseMs);
        if (data.audio) _playAudio(data.audio, answerText);
        else _speakFallback(answerText);

      } catch (err) {
        const isCurrentRequest = _pendingRequest === controller;
        if (isCurrentRequest) {
          _pendingRequest = null;
          _stopResponseTimer();
          _removeThinkingBubble();
        }
        if (err.name === "AbortError") {
          console.log("[Fetch] Request aborted (new question arrived).");
          return;
        }
        if (!isCurrentRequest) return;

        console.error("[Fetch] Error:", err);
        const errMsg = "Sorry, I couldn't reach the server. Please check that the backend is running.";
        _appendBotBubble(errMsg);
        _setStatus(State.IDLE, "⚠️ Connection error");

        if (_micEnabled) {
          _setState(State.LISTENING);
          setTimeout(_startRecognition, 500);
        } else {
          _setState(State.IDLE);
        }
      }
    }

    // -------------------------------------------------------------------------
    //  Public: send text from input box
    // -------------------------------------------------------------------------

    function _startResponseTimer() {
      _stopResponseTimer();
      _responseStartedAt = performance.now();
      const timer = document.getElementById("queryResponseTimer");
      const timerValue = document.getElementById("queryResponseTimerValue");
      if (timer) timer.dataset.running = "true";
      const update = () => {
        if (timerValue && _responseStartedAt !== null) {
          timerValue.textContent = `${((performance.now() - _responseStartedAt) / 1000).toFixed(1)}s`;
        }
      };
      update();
      _responseTimerInterval = setInterval(update, 100);
    }

    function _stopResponseTimer() {
      if (_responseTimerInterval) clearInterval(_responseTimerInterval);
      _responseTimerInterval = null;
      if (_responseStartedAt === null) return 0;
      const elapsed = performance.now() - _responseStartedAt;
      _responseStartedAt = null;
      const timer = document.getElementById("queryResponseTimer");
      if (timer) timer.dataset.running = "false";
      return elapsed;
    }

    function sendText() {
      const question = document.getElementById("textInput").value.trim();
      if (!question) return;
      _submitQuery(question);
    }

    // -------------------------------------------------------------------------
    //  Public: toggle microphone
    // -------------------------------------------------------------------------

    function toggleMic() {
      _micEnabled = !_micEnabled;
      _setMicButton(_micEnabled);

      if (_micEnabled) {
        _startRecognition();
      } else {
        _stopRecognition();
        if (_state === State.LISTENING) {
          _setState(State.IDLE);
          _setStatus(State.IDLE, "Microphone off");
        }
      }
    }

    // -------------------------------------------------------------------------
    //  Public: stop speaking (barge-in button)
    // -------------------------------------------------------------------------

    function stopSpeaking() {
      _stopAudio();
      _interruptAvatar();
      if (_micEnabled) {
        _setState(State.LISTENING);
        setTimeout(_startRecognition, 200);
      } else {
        _setState(State.IDLE);
        _setStatus(State.IDLE, "Ready");
      }
    }

    // -------------------------------------------------------------------------
    //  UI helpers
    // -------------------------------------------------------------------------

    function _setState(s) {
      _state = s;
    }

    function _setStatus(state, msg) {
      const bar  = document.getElementById("statusBar");
      const text = document.getElementById("statusText");
      bar.dataset.state = state;
      text.textContent  = msg;
    }

    function _setMicButton(on) {
      const btn = document.getElementById("btnMic");
      btn.textContent = on ? "🔴" : "🎤";
      btn.title       = on ? "Click to turn off microphone" : "Click to turn on microphone";
      btn.classList.toggle("active", on);
    }

    function _setWave(on) {
      const bars = document.querySelectorAll(".wave-bar");
      bars.forEach(b => b.classList.toggle("active", on));
    }

    // ---- Chat bubbles ---------------------------------------------------

    function _appendUserBubble(text) {
      _appendBubble(text, "user", "👤");
    }

    function _appendBotBubble(text, responseMs = null) {
      const row = _appendBubble(text, "bot", "🛡️");
      if (row && responseMs !== null) {
        const note = document.createElement("div");
        note.className = "response-time-note";
        note.textContent = `Response time: ${(responseMs / 1000).toFixed(1)} seconds`;
        row.querySelector(".bubble").appendChild(note);
        const chatArea = document.getElementById("chatArea");
        requestAnimationFrame(() => chatArea.scrollTop = chatArea.scrollHeight);
        setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 80);
      }
    }

    function _appendBubble(text, who, icon) {
      const chatArea = document.getElementById("chatArea");

      const row = document.createElement("div");
      row.className = `bubble-row ${who}`;

      const av = document.createElement("div");
      av.className   = "avatar-icon";
      av.textContent = icon;

      const bubble = document.createElement("div");
      bubble.className   = "bubble";
      // Render comparison tables using DOM text nodes; source text cannot inject HTML.
      bubble.style.whiteSpace = "pre-wrap";
      const lines = String(text).split(/\r?\n/);
      const hasMarkdownTable = lines.some((line, index) =>
        /^\s*\|.*\|\s*$/.test(line) && /^\s*\|\s*:?-{3,}/.test(lines[index + 1] || "")
      );
      if (!hasMarkdownTable) {
        bubble.textContent = text;
      } else {
        const fragment = document.createDocumentFragment();
        const isSeparator = line => /^\s*\|\s*:?-{3,}/.test(line);
        const cells = line => line.trim().replace(/^\|/, "").replace(/\|$/, "")
          .split("|").map(cell => cell.trim().replace(/\\\|/g, "|").replace(/\*\*/g, ""));
        let index = 0;
        while (index < lines.length) {
          if (/^\s*\|.*\|\s*$/.test(lines[index]) && isSeparator(lines[index + 1] || "")) {
            const wrapper = document.createElement("div");
            wrapper.className = "comparison-table-wrap";
            const table = document.createElement("table");
            table.className = "comparison-table";
            const head = document.createElement("thead");
            const headRow = document.createElement("tr");
            cells(lines[index]).forEach(value => {
              const cell = document.createElement("th");
              cell.textContent = value;
              headRow.appendChild(cell);
            });
            head.appendChild(headRow);
            table.appendChild(head);
            const body = document.createElement("tbody");
            index += 2;
            while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) {
              const row = document.createElement("tr");
              cells(lines[index]).forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
              });
              body.appendChild(row);
              index++;
            }
            table.appendChild(body);
            wrapper.appendChild(table);
            fragment.appendChild(wrapper);
            if (index < lines.length) fragment.appendChild(document.createElement("br"));
          } else {
            fragment.appendChild(document.createTextNode(lines[index]));
            if (index < lines.length - 1) fragment.appendChild(document.createElement("br"));
            index++;
          }
        }
        bubble.appendChild(fragment);
      }

      row.appendChild(av);
      row.appendChild(bubble);
      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
      requestAnimationFrame(() => chatArea.scrollTop = chatArea.scrollHeight);
      setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 80);
      return row;
    }

    function _appendThinkingBubble() {
      const chatArea = document.getElementById("chatArea");

      const row = document.createElement("div");
      row.className = "bubble-row bot";
      row.id = "thinkingBubble";

      const av = document.createElement("div");
      av.className   = "avatar-icon";
      av.textContent = "🛡️";

      const bubble = document.createElement("div");
      bubble.className = "bubble thinking-bubble";
      bubble.innerHTML = '<div class="thinking-dots" aria-hidden="true"><span></span><span></span><span></span></div>' +
        '<span id="queryResponseTimer" class="query-timer" data-running="false" aria-label="Response timer">' +
        '<span class="timer-indicator" aria-hidden="true"></span><span id="queryResponseTimerValue">0.0s</span></span>';

      row.appendChild(av);
      row.appendChild(bubble);
      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
      requestAnimationFrame(() => chatArea.scrollTop = chatArea.scrollHeight);
      setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 80);
      return row;
    }

    function _removeThinkingBubble() {
      const el = document.getElementById("thinkingBubble");
      if (el) el.remove();
      _thinkingBubble = null;
    }

    // ---- Utility --------------------------------------------------------

    function _warn(msg) {
      console.warn("[Insura]", msg);
      _appendBotBubble("⚠️ " + msg);
    }

    function _generateUUID() {
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    // -------------------------------------------------------------------------
    //  Public interface
    // -------------------------------------------------------------------------

    return { init, toggleMic, sendText, stopSpeaking, toggleAvatar };

  })(); // InsuraAgent IIFE


  // Boot on DOM ready
  document.addEventListener("DOMContentLoaded", () => InsuraAgent.init());

  </script>
</body>
